name: Resolve all Cardborn images
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/resolve-all-thumbnails.mjs'
      - '.github/workflows/resolve-all-thumbnails.yml'
permissions:
  contents: write
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve static thumbnails
        run: node scripts/resolve-all-thumbnails.mjs
      - name: Commit thumbnail map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/thumbnails.js
          if ! git diff --cached --quiet; then
            git commit -m "Update Cardborn thumbnail map"
            git push
          fi
