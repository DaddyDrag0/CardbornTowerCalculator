name: Diagnose Bellsinger

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-bellsinger.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Hollow Bellsinger engine diagnostic
        run: |
          node <<'NODE'
          const fs = require('fs');
          global.window = global;
          const noop = () => {};
          const dummy = () => ({style:{},dataset:{},classList:{add:noop,remove:noop,toggle:noop},appendChild:noop,remove:noop,addEventListener:noop,setAttribute:noop,querySelector:()=>null,querySelectorAll:()=>[],focus:noop,setSelectionRange:noop,innerHTML:'',textContent:'',value:'',disabled:false});
          global.document = {getElementById:()=>dummy(),createElement:()=>dummy(),head:dummy(),body:dummy(),documentElement:{dataset:{}}};
          global.localStorage = {getItem:()=>null,setItem:noop,removeItem:noop};
          global.navigator = {hardwareConcurrency:4};
          global.Worker = undefined;
          const dataFiles = ['cards-1.js','cards-2.js','cards-3.js','cards-4.js','cards-5.js','meta.js','corrupted.js'];
          for (const f of dataFiles) (0,eval)(fs.readFileSync('data/'+f,'utf8'));
          const engineFiles = ['app-1.txt','app-2.txt','app-3.txt','app-5.txt','app-fabled-source.txt','app-7a.txt','app-7b.txt','app-7c.txt','app-7d.txt','app-7e.txt','app-fabled-restore.txt','app-8.txt','app-9.txt','app-11.txt','app-12-worker.txt','app-corrupted-engine.txt'];
          const parts = engineFiles.map(f=>fs.readFileSync(f,'utf8'));
          parts.splice(3,0,'function bind(){}\n');
          const hook = `\nglobalThis.__bellsingerDiag=function(){\n            const card=BY.get('Hollow Bellsinger');\n            const enemyCard=CARDS.find(c=>c.name!=='Hollow Bellsinger'&&!c.isSecret);\n            if(!card||!enemyCard) throw new Error('Diagnostic cards missing');\n            state.pAbilities=true; state.eAbilities=true;\n            const b=fighter(card,flags(),'p',0,{hp:21436,atk:10718});\n            const e=fighter(enemyCard,flags(),'e',0,{hp:3783,atk:100});\n            const out=battle([b],[e],rng32(12345),'',true);\n            return {ability:b.ability?.name,actions:out.actions,changes:out.changes,win:out.win,events:out.debug?.events||[],finalB:{hp:b.hp,max:b.max,atk:b.atk,turn:b.turn,dead:b.dead},finalE:{hp:e.hp,max:e.max,atk:e.atk,turn:e.turn,dead:e.dead}};\n          };\n          })();`;
          (0,eval)(parts.join('')+hook);
          const out = global.__bellsingerDiag();
          console.log('BELLSINGER_DIAGNOSTIC='+JSON.stringify(out,null,2));
          console.log('TURN_EVENTS='+(out.events||[]).filter(x=>x.type==='turn').length);
          console.log('ABILITY_EVENTS='+(out.events||[]).filter(x=>x.type==='ability').length);
          NODE
      - name: Remove diagnostic workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/diagnose-bellsinger.yml
          git add -A
          git commit -m "Remove Bellsinger diagnostic workflow" || true
          git pull --rebase origin main
          git push origin HEAD:main
